name: Validate scaffold

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate structure and public safety
        run: python3 scripts/validate_scaffold.py
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest
