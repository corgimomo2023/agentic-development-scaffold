name: Agent task
description: Create a bounded, reviewable task for a human or AI agent
title: "[Agent Task] "
labels: ["agent-task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One observable outcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Authoritative context and artifact links
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Allowed scope, files, tools, and side effects
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Live task checklist
      description: This is the authoritative task checklist. Update it as scope and completion change; do not duplicate it in a log file.
      value: |
        - [ ] <smallest verifiable task>
        - [ ] <verification / review task>
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and exact verification commands
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Stop and escalation conditions
    validations:
      required: true
